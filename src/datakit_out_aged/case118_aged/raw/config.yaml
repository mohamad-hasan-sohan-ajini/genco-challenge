admittance_perturbation:
  sigma: 0.2
  type: none
generation_perturbation:
  sigma: 1.0
  type: cost_permutation
load:
  agg_profile: default
  change_reactive_power: true
  generator: agg_load_profile
  global_range: 0.4
  max_scaling_factor: 4.0
  scenarios: 1000
  sigma: 0.2
  start_scaling_factor: 1.0
  step_size: 0.1
network:
  name: case118_aged
  network_dir: ./grids
  reader: native
  source: file
settings:
  data_dir: ./datakit_out_aged
  dcpf_fast: true
  enable_solver_logs: true
  include_dc_res: true
  large_chunk_size: 250
  max_iter: 200
  mode: pf
  num_processes: 8
  opf_formulation: polar
  overwrite: true
  pf_fast: true
  pf_solver: powermodel
  seed: 42
topology_perturbation:
  type: none
